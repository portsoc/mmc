name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix test
      - run: npm --prefix test run test:unit
      - run: npx -y firebase-tools@latest emulators:exec --only firestore --project demo-mmc "npm --prefix test run test:rules"
      - run: npx -y firebase-tools@latest emulators:exec --only database --project demo-mmc "npm --prefix test run test:rtdb"
      # Browser tests: the app has the real project id built in, so the
      # emulators must use it too. Nothing here reaches production.
      - run: npm ci --prefix functions
      - run: npx --prefix test playwright install --with-deps chromium
      - run: npx -y firebase-tools@latest emulators:exec --project mission-mmc-4476 "npm --prefix test run test:e2e"
