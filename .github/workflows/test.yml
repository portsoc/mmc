name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix test
      - run: npm --prefix test run test:unit
      - run: npx -y firebase-tools@latest emulators:exec --only firestore --project demo-mmc "npm --prefix test run test:rules"
